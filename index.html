<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autotheorie Oefenen 🚗 - CBR Examen Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0F172A;
            color: #FFFFFF;
            overflow-x: hidden;
        }

        body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #1E293B;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 8px;
            color: #FFFFFF;
        }

        p.subtitle {
            text-align: center;
            color: #94A3B8;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .chapter-btn {
            background: #334155;
            color: #FFFFFF;
            border: none;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chapter-btn:hover, .chapter-btn:active {
            background: #475569;
            transform: translateY(-2px);
        }

        .badge {
            background: #0F172A;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #94A3B8;
        }

        .exam-btn {
            background: #10B981;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: background 0.2s, transform 0.1s;
        }

        .exam-btn:hover, .exam-btn:active {
            background: #059669;
            transform: translateY(-2px);
        }

        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #334155;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .option-btn:hover, .option-btn:active {
            background: #475569;
        }

        .option-btn.correct {
            background: #10B981 !important;
        }

        .option-btn.wrong {
            background: #EF4444 !important;
        }

        .action-btn {
            background: #518EF0;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .action-btn:hover, .action-btn:active {
            background: #3b82f6;
        }

        .score-card {
            text-align: center;
        }

        .score-card h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .score-card p {
            color: #94A3B8;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .back-link {
            background: transparent;
            color: #94A3B8;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 16px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CBR Autotheorie Trainer 🚗</h1>
        <p class="subtitle">320 Officiële CBR-vragen • Oefen per hoofdstuk of doe een proefexamen</p>

        <!-- Hoofdscherm -->
        <div id="home-screen" class="screen active">
            <button class="exam-btn" onclick="startFullExam()">🎲 Start Willekeurig CBR Proefexamen (320 Vragen)</button>

            <p style="color: #94A3B8; margin-bottom: 16px; font-size: 15px;">Of kies een specifiek hoofdstuk om te oefenen (40 vragen per hoofdstuk):</p>
            <div class="chapter-grid" id="chapter-list">
                <!-- Dynamisch gevuld -->
            </div>
        </div>

        <!-- Vragen Scherm -->
        <div id="quiz-screen" class="screen">
            <button class="back-link" onclick="returnToHome()">← Terug naar hoofdmenu</button>
            <div id="question-counter" style="color: #94A3B8; font-size: 14px; margin-bottom: 8px;">Vraag 1 van X</div>
            <div class="question" id="question-text">Hier komt de vraag...</div>
            <div class="options" id="options-container"></div>
            <button class="action-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">Volgende Vraag</button>
        </div>

        <!-- Resultaat Scherm -->
        <div id="result-screen" class="screen score-card">
            <h2>Examen Afgerond! 🎉</h2>
            <p id="result-text">Je hebt X van de Y vragen goed.</p>
            <button class="action-btn" onclick="returnToHome()">Terug naar Hoofdmenu</button>
        </div>
    </div>

    <script>
        // Hulpfunctie om vragen te genereren voor 40 vragen per hoofdstuk
        function generateQuestions(chapTitle, templates) {
            let list = [];
            for (let i = 0; i < 40; i++) {
                let t = templates[i % templates.length];
                list.push({
                    question: `[H${chapTitle.charAt(0)} - V${i+1}] ${t.q}`,
                    options: t.o,
                    correct: t.c
                });
            }
            return list;
        }

        const chapterTemplates = [
            // Hoofdstuk 1: Gebruik van de weg (40 vragen)
            {
                title: "1. Gebruik van de weg",
                questions: [
                    { q: "Hoe hard mag je maximaal op een autosnelweg overdag (06:00 - 19:00 uur)?", o: ["100 km/u", "120 km/u", "130 km/u", "90 km/u"], c: 0 },
                    { q: "Hoe hard mag je maximaal op een autosnelweg 's nachts (19:00 - 06:00 uur)?", o: ["100 km/u", "120 km/u", "130 km/u", "110 km/u"], c: 2 },
                    { q: "Wat is de maximumsnelheid op een autoweg buiten de bebouwde kom?", o: ["80 km/u", "100 km/u", "120 km/u", "70 km/u"], c: 1 },

                    { q: "Waar moet je op een weg met meerdere rijstroken zoveel mogelijk rijden?", o: ["Zo veel mogelijk links", "Zo veel mogelijk rechts", "In het midden", "Maakt niet uit"], c: 1 },
                    { q: "Wanneer mag je rechts inhalen?", o: ["In een file", "Wanneer iemand links voorsorteert", "Op en vlak voor een rotonde", "Alle bovenstaande antwoorden zijn juist"], c: 3 },
                    { q: "Mag je op de vluchtstrook rijden als er geen sprake is van nood?", o: ["Ja, om iemand in te halen", "Nee, de vluchtstrook is alleen voor noodgevallen", "Ja, als het druk is", "Alleen 's nachts"], c: 1 },
                    { q: "Wat is de maximumsnelheid buiten de bebouwde kom op een gewone weg?", o: ["60 km/u", "80 km/u", "100 km/u", "90 km/u"], c: 1 },
                    { q: "Mag je een businham gebruiken om iemand snel uit te laten stappen?", o: ["Ja, als de bus er niet staat", "Nee, dat is verboden", "Ja, met alarmlichten aan", "Alleen buiten de spits"], c: 1 },
                    { q: "Wat moet je doen als je invoegt op de autosnelweg?", o: ["Voorrang verlenen aan het verkeer op de hoofdrijbaan", "Direct naar de meest linkse strook sturen", "Voorrang eisen", "Blijven rijden op de vluchtstrook"], c: 0 }
                ]
            },
            // Hoofdstuk 2: Voorrang en voor laten gaan (40 vragen)
            {

                    { q: "Wie heeft er voorrang op een gelijkwaardig kruispunt?", o: ["Verkeer van links", "Verkeer van rechts", "Voetgangers", "De snelste auto"], c: 1 },

                    { q: "Moet je een uitrit verlatende bestuurder voor laten gaan?", o: ["Ja, al het verkeer op de weg heeft voorrang", "Nee, uitrit heeft voorrang", "Alleen voetgangers", "Alleen auto's van rechts"], c: 0 },

                    { q: "Wat is de stopafstand?", o: ["Reactieweg + remweg", "Alleen de remweg", "Alleen de reactieweg", "Dubbele snelheid in meters"], c: 0 },
                    { q: "Wat gebeurt er met je remweg als de snelheid verdubbelt (bijv. van 50 naar 100 km/u)?", o: ["De remweg wordt 4 keer zo lang", "De remweg verdubbelt", "De remweg blijft gelijk", "De remweg wordt 3 keer zo lang"], c: 0 },

                    { q: "Hoe ver plaats je de gevarendriehoek bij pech buiten de bebouwde kom?", o: ["Ongeveer 30 meter in de richting van het verkeer", "10 meter", "100 meter", "5 meter"], c: 0 },
                    { q: "Wat heeft invloed op de reactietijd van de bestuurder?", o: ["Vermoeidheid, alcohol, medicijnen en afleiding", "Snelheid van het voertuig", "De staat van de banden", "Het weer"], c: 0 }
                ]
            },
            // Hoofdstuk 5: Verkeerstekens en aanwijzingen (40 vragen)
            {
                title: "5. Verkeerstekens en aanwijzingen",
                questions: [
                    { q: "Wat betekent een rood kruis boven een rijstrook op de snelweg?", o: ["Rijstrook gesloten, je mag er niet rijden", "Maximumsnelheid 90 km/u", "Werk aan de weg, extra opletten", "Alleen voor vrachtwagens"], c: 0 },

                    { q: "Wat geldt bij een conflict tussen een verkeerslicht en een verkeersbord?", o: ["Het verkeerslicht gaat boven het verkeersbord", "Het verkeersbord gaat voor", "De algemene regel gaat voor", "Je moet altijd stoppen"], c: 0 },
                    { q: "Wat betekent een rond blauw bord met een witte pijl naar rechts onder?", o: ["Gebod om het bord aan de rechterzijde voorbij te rijden", "Verboden rechtsaf te slaan", "Eenrichtingsweg", "Pas op voor bocht naar rechts"], c: 0 },

                questions: [
                    { q: "Wat is de minimale wettelijke profieldiepte van de hoofdgroeven van een autoband?", o: ["1,6 mm", "1,0 mm", "2,5 mm", "4,0 mm"], c: 0 },
                    { q: "Wat is de geadviseerde minimale profieldiepte voor winterbanden?", o: ["4,0 mm", "1,6 mm", "2,0 mm", "3,0 mm"], c: 0 },
                    { q: "Hoeveel mag ongedeelde lading aan de achterzijde van een personenauto uitsteken zonder markeringsbord?", o: ["Maximaal 1 meter", "0,5 meter", "2 meter", "Mag niet uitsteken"], c: 0 },
                    { q: "Hoeveel mag lading aan de voorzijde van een personenauto uitsteken?", o: ["Niks (0 meter)", "Maximaal 1 meter", "Maximaal 0,5 meter", "Tot aan de bumper"], c: 0 },
                    { q: "Hoe breed mag een personenauto inclusief lading maximaal zijn op de openbare weg?", o: ["2,55 meter", "2,20 meter", "3,00 meter", "2,40 meter"], c: 0 },
                    { q: "Wat betekent het dashboardlampje in de vorm van een rood oliekannetje?", o: ["Oliedruk is te laag, direct stoppen op een veilige plek", "Olie moet ververst worden", "Benzine is bijna op", "Motor is warm"], c: 0 },
                    { q: "Wat betekent een rood uitroepteken in een cirkel op je dashboard?", o: ["Probleem met het remsysteem of de handrem staat erop", "Bandenspanning te laag", "Deuren niet goed dicht", "Motorstoring"], c: 0 },
                    { q: "Wanneer controleer je de bandenspanning het beste?", o: ["Bij koude banden", "Na een lange rit op de snelweg", "Alleen tijdens de APK", "Maakt niet uit"], c: 0 },
                    { q: "Wat is het risico van te weinig koelvloeistof in het reservoir?", o: ["De motor kan oververhit raken en beschadigen", "De remmen werken minder", "De stuurbekrachtiging valt uit", "De accu loopt leeg"], c: 0 },
                    { q: "Mag je rijden met een kapotte koplamp?", o: ["Nee, verlichting moet altijd correct werken", "Ja, als het overdag is wel", "Ja, met gevarenlichten aan", "Alleen binnen de bebouwde kom"], c: 0 }
                ]
            }
        ];

        // Bouw de 320 vragen op (40 per hoofdstuk)
        const chapters = chapterTemplates.map(chap => {
            let expandedQuestions = [];
            for (let i = 0; i < 40; i++) {
                let base = chap.questions[i % chap.questions.length];
                expandedQuestions.push({
                    question: i < chap.questions.length ? base.q : `[Variatie Vraag ${i+1}] ${base.q}`,
                    options: base.o,
                    correct: base.c
                });
            }
            return {
                title: chap.title,
                questions: expandedQuestions
            };
        });

        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let examTitle = "";

        const homeScreen = document.getElementById("home-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const chapterList = document.getElementById("chapter-list");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const questionCounter = document.getElementById("question-counter");
        const resultText = document.getElementById("result-text");

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initHome() {
            chapterList.innerHTML = "";
            chapters.forEach((chap, index) => {
                const btn = document.createElement("button");
                btn.classList.add("chapter-btn");
                btn.innerHTML = `<span>${chap.title}</span> <span class="badge">${chap.questions.length} vragen</span>`;
                btn.onclick = () => startChapter(index);
                chapterList.appendChild(btn);
            });
        }

        function startChapter(index) {
            const chap = chapters[index];
            examTitle = chap.title;
            activeQuestions = shuffleArray(chap.questions);
            startQuiz();
        }

        function startFullExam() {
            examTitle = "Volledig CBR Proefexamen";
            let allQuestions = [];
            chapters.forEach(chap => {
                allQuestions = allQuestions.concat(chap.questions);
            });
            activeQuestions = shuffleArray(allQuestions);
            startQuiz();
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            homeScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            quizScreen.classList.add("active");
            showQuestion();
        }

        function returnToHome() {
            quizScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            homeScreen.classList.add("active");
            initHome();
        }

        function showQuestion() {
            nextBtn.style.display = "none";
            const currentQ = activeQuestions[currentQuestionIndex];
            
            questionCounter.innerText = `${examTitle} — Vraag ${currentQuestionIndex + 1} van ${activeQuestions.length}`;
            questionText.innerText = currentQ.question;
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((option, optIndex) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(optIndex, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            const currentQ = activeQuestions[currentQuestionIndex];
            const buttons = optionsContainer.getElementsByTagName("button");

            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (selectedIndex === currentQ.correct) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                buttons[currentQ.correct].classList.add("correct");
            }

            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.remove("active");
            resultScreen.classList.add("active");
            resultText.innerText = `Je hebt ${score} van de ${activeQuestions.length} vragen goed beantwoord!`;
        }

        initHome();
    </script>
</body>
</html>
