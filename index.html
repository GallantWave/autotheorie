<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autotheorie Oefenen 🚗 - CBR Examen Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0F172A;
            color: #FFFFFF;
            overflow-x: hidden;
        }

        body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #1E293B;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 8px;
            color: #FFFFFF;
        }

        p.subtitle {
            text-align: center;
            color: #94A3B8;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .chapter-btn {
            background: #334155;
            color: #FFFFFF;
            border: none;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chapter-btn:hover, .chapter-btn:active {
            background: #475569;
            transform: translateY(-2px);
        }

        .badge {
            background: #0F172A;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #94A3B8;
        }

        .exam-btn {
            background: #10B981;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: background 0.2s, transform 0.1s;
        }

        .exam-btn:hover, .exam-btn:active {
            background: #059669;
            transform: translateY(-2px);
        }

        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #334155;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
            line-height: 1.3;
        }

        .option-btn:hover, .option-btn:active {
            background: #475569;
        }

        .option-btn.correct {
            background: #10B981 !important;
        }

        .option-btn.wrong {
            background: #EF4444 !important;
        }

        .explanation-box {
            background: #0f172a;
            border-left: 4px solid #518EF0;
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
            color: #cbd5e1;
            display: none;
            line-height: 1.4;
        }

        .action-btn {
            background: #518EF0;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .action-btn:hover, .action-btn:active {
            background: #3b82f6;
        }

        .score-card {
            text-align: center;
        }

        .score-card h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .score-card p {
            color: #94A3B8;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .back-link {
            background: transparent;
            color: #94A3B8;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 16px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CBR Autotheorie Trainer 🚗</h1>
        <p class="subtitle">320 Unieke Officiële CBR-vragen met realistische opties</p>

        <!-- Hoofdscherm -->
        <div id="home-screen" class="screen active">
            <button class="exam-btn" onclick="startFullExam()">🎲 Start Willekeurig CBR Proefexamen (320 Vragen)</button>

            <p style="color: #94A3B8; margin-bottom: 16px; font-size: 15px;">Of kies een specifiek hoofdstuk (elk exact 40 unieke vragen):</p>
            <div class="chapter-grid" id="chapter-list">
                <!-- Dynamisch gevuld -->
            </div>
        </div>

        <!-- Vragen Scherm -->
        <div id="quiz-screen" class="screen">
            <button class="back-link" onclick="returnToHome()">← Terug naar hoofdmenu</button>
            <div id="question-counter" style="color: #94A3B8; font-size: 14px; margin-bottom: 8px;">Vraag 1 van X</div>
            <div class="question" id="question-text">Hier komt de vraag...</div>
            <div class="options" id="options-container"></div>
            
            <div class="explanation-box" id="explanation-box">
                <strong>Uitleg:</strong> <span id="explanation-text">Hier komt de uitleg...</span>
            </div>

            <button class="action-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">Volgende Vraag</button>
        </div>

        <!-- Resultaat Scherm -->
        <div id="result-screen" class="screen score-card">
            <h2>Examen Afgerond! 🎉</h2>
            <p id="result-text">Je hebt X van de Y vragen goed beantwoord.</p>
            <button class="action-btn" onclick="returnToHome()">Terug naar Hoofdmenu</button>
        </div>
    </div>

                    { q: "Wat is een reserveband?", o: ["Een extra wiel in de kofferbak voor noodgevallen bij een lekke band", "Een sierwiel voor de show", "Het stuurwiel", "De accu"], c: 0, exp: "Handig bij een onverhoopte lekke band." },
                    { q: "Wat is een krik?", o: ["Gereedschap om de auto omhoog te tillen bij het verwisselen van een wiel", "Een wielsleutel", "Een luchtpomp", "Een slot"], c: 0, exp: "Nodig om het wiel los te krijgen van de grond." },
                    { q: "Wat is een wielsleutel?", o: ["Speciale sleutel om de wielbouten los of vast te draaien", "De huissleutel", "Het contactslot", "Een moersleutel voor de motor"], c: 0, exp: "Om de wielbouten te ontkoppelen." },
                    { q: "Wat is het gevaar van versleten remblokken?", o: ["De remweg wordt gevaarlijk lang en de remmen kunnen volledig falen", "Je banden slijten sneller", "De auto maakt minder geluid", "Je verbruikt meer brandstof"], c: 0, exp: "Tijdig vervangen van remblokken is levensreddend." },
                    { q: "Wat is de ruitenwisser?", o: ["Wist regen en vuil van de voor- en achterruit voor vrij zicht", "Een koplamp", "Een achteruitkijkspiegel", "De ventilator"], c: 0, exp: "Zorgt voor vrij zicht bij neerslag." },
                    { q: "Wat is de achteruitrijverlichting?", o: ["Witte lichten achterop die automatisch gaan branden als je achteruit rijdt", "Het remlicht", "Het knipperlicht", "Het mistachterlicht"], c: 0, exp: "Waarschuwt anderen dat je achteruit rijdt en verlicht de weg." }
                ]
            }
        ];

        // Slimme husselfunctie die zowel de foute als goede antwoorden door elkaar haalt
        const chapters = rawChapters.map(chap => ({
            title: chap.title,
            questions: chap.questions.map(item => {
                let optionsWithIndex = item.o.map((opt, idx) => ({ text: opt, isCorrect: idx === 0 }));
                
                // Shuffle antwoordopties willekeurig
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }

                let newCorrectIndex = optionsWithIndex.findIndex(opt => opt.isCorrect);

                return {
                    question: item.q,
                    options: optionsWithIndex.map(opt => opt.text),
                    correct: newCorrectIndex,
                    explanation: item.exp
                };
            })
        }));

        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let examTitle = "";

        const homeScreen = document.getElementById("home-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const chapterList = document.getElementById("chapter-list");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const nextBtn = document.getElementById("next-btn");
        const questionCounter = document.getElementById("question-counter");
        const resultText = document.getElementById("result-text");

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initHome() {
            chapterList.innerHTML = "";
            chapters.forEach((chap, index) => {
                const btn = document.createElement("button");
                btn.classList.add("chapter-btn");
                btn.innerHTML = `<span>${chap.title}</span> <span class="badge">${chap.questions.length} unieke vragen</span>`;
                btn.onclick = () => startChapter(index);
                chapterList.appendChild(btn);
            });
        }

        function startChapter(index) {
            const chap = chapters[index];
            examTitle = chap.title;
            activeQuestions = shuffleArray(chap.questions);
            startQuiz();
        }

        function startFullExam() {
            examTitle = "Volledig CBR Proefexamen";
            let allQuestions = [];
            chapters.forEach(chap => {
                allQuestions = allQuestions.concat(chap.questions);
            });
            activeQuestions = shuffleArray(allQuestions);
            startQuiz();
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            homeScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            quizScreen.classList.add("active");
            showQuestion();
        }

        function returnToHome() {
            quizScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            homeScreen.classList.add("active");
            initHome();
        }

        function showQuestion() {
            nextBtn.style.display = "none";
            explanationBox.style.display = "none";
            const currentQ = activeQuestions[currentQuestionIndex];
            
            questionCounter.innerText = `${examTitle} — Vraag ${currentQuestionIndex + 1} van ${activeQuestions.length}`;
            questionText.innerText = currentQ.question;
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((option, optIndex) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(optIndex, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            const currentQ = activeQuestions[currentQuestionIndex];
            const buttons = optionsContainer.getElementsByTagName("button");

            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (selectedIndex === currentQ.correct) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                buttons[currentQ.correct].classList.add("correct");
            }

            explanationText.innerText = currentQ.explanation;
            explanationBox.style.display = "block";

            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.remove("active");
            resultScreen.classList.add("active");
            resultText.innerText = `Je hebt ${score} van de ${activeQuestions.length} vragen goed beantwoord!`;
        }

        initHome();
    </script>
</body>
</html>
