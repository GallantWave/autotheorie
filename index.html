<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autotheorie Oefenen 🚗 - CBR Examen Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0F172A;
            color: #FFFFFF;
            overflow-x: hidden;
        }

        body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #1E293B;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 8px;
            color: #FFFFFF;
        }

        p.subtitle {
            text-align: center;
            color: #94A3B8;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .chapter-btn {
            background: #334155;
            color: #FFFFFF;
            border: none;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s, transform 0.1s;
        }

        .chapter-btn:hover, .chapter-btn:active {
            background: #475569;
            transform: translateY(-2px);
        }

        .exam-btn {
            background: #10B981;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: background 0.2s, transform 0.1s;
        }

        .exam-btn:hover, .exam-btn:active {
            background: #059669;
            transform: translateY(-2px);
        }

        .question {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #334155;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .option-btn:hover, .option-btn:active {
            background: #475569;
        }

        .option-btn.correct {
            background: #10B981 !important;
        }

        .option-btn.wrong {
            background: #EF4444 !important;
        }

        .action-btn {
            background: #518EF0;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .action-btn:hover, .action-btn:active {
            background: #3b82f6;
        }

        .score-card {
            text-align: center;
        }

        .score-card h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .score-card p {
            color: #94A3B8;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .back-link {
            background: transparent;
            color: #94A3B8;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 16px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CBR Autotheorie Trainer 🚗</h1>
        <p class="subtitle">Oefen gericht per hoofdstuk of doe een willekeurig proefexamen</p>

        <!-- Hoofdscherm -->
        <div id="home-screen" class="screen active">
            <!-- Knop voor willekeurige examenmodus -->
            <button class="exam-btn" onclick="startFullExam()">🎲 Start Willekeurig CBR Proefexamen (Alle hoofdstukken)</button>

            <p style="color: #94A3B8; margin-bottom: 16px; font-size: 15px;">Of kies een specifiek hoofdstuk om te oefenen:</p>
            <div class="chapter-grid" id="chapter-list">
                <!-- Wordt dynamisch gevuld -->
            </div>
        </div>

        <!-- Vragen Scherm -->
        <div id="quiz-screen" class="screen">
            <button class="back-link" onclick="returnToHome()">← Terug naar hoofdmenu</button>
            <div id="question-counter" style="color: #94A3B8; font-size: 14px; margin-bottom: 8px;">Vraag 1 van X</div>
            <div class="question" id="question-text">Hier komt de vraag...</div>
            <div class="options" id="options-container"></div>
            <button class="action-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">Volgende Vraag</button>
        </div>

        <!-- Resultaat Scherm -->
        <div id="result-screen" class="screen score-card">
            <h2>Examen Afgerond! 🎉</h2>
            <p id="result-text">Je hebt X van de Y vragen goed.</p>
            <button class="action-btn" onclick="returnToHome()">Terug naar Hoofdmenu</button>
        </div>
    </div>

    <script>
        const chapters = [
            {
                title: "1. Gebruik van de weg",
                questions: [
                    { question: "Hoe hard mag je maximaal rijden op een autosnelweg in Nederland (tenzij borden anders aangeven)?", options: ["100 km/u (overdag)", "120 km/u", "130 km/u", "100 km/u de hele dag"], correct: 0 },
                    { question: "Waar moet je zoveel mogelijk rijden op een autosnelweg met drie rijstroken?", options: ["Uitsluitend op de linker rijstrook", "Zoveel mogelijk rechts", "In het midden", "Dat mag je zelf kiezen"], correct: 1 },
                    { question: "Wanneer mag je iemand rechts inhalen?", options: ["Dat mag nooit", "Als je in een file rijdt waar de rechterrijstrook sneller rijdt", "Als de bestuurder voor je linksaf wil voorsorteren", "Beide antwoorden 2 en 3 zijn juist"], correct: 3 }
                ]
            },
            {
                title: "2. Voorrang en voor laten gaan",
                questions: [
                    { question: "Wie heeft er voorrang op een onoverzichtelijk gelijkwaardig kruispunt?", options: ["Bestuurders van links", "Bestuurders van rechts", "Degene die het hardst rijdt", "Grote voertuigen altijd"], correct: 1 },
                    { question: "Je slaat linksaf op een kruispunt. Wie moet je voor laten gaan?", options: ["Alleen tegemoetkomende bestuurders die rechtdoor gaan", "Tegemoetkomende bestuurders én bestuurders die rechts afslaan", "Tegemoetkomende bestuurders die rechtdoor gaan óf rechts afslaan op dezelfde weg", "Niemand, jij hebt voorrang"], correct: 2 }
                ]
            },
            {
                title: "3. Bijzondere wegen, weggedeelten en manoeuvres",
                questions: [
                    { question: "Wat is de maximumsnelheid binnen een officiële woonerf?", options: ["15 km/u", "30 km/u", "Stapvoets (ongeveer 15 km/u)", "50 km/u"], correct: 2 },
                    { question: "Mag je keren (een U-turn maken) op een autosnelweg?", options: ["Ja, als het rustig is", "Nee, dat is ten strengste verboden", "Alleen bij een noodgeval", "Ja, via de vluchtstrook"], correct: 1 }
                ]
            },
            {
                title: "4. Veilig rijden met het voertuig en noodsituaties",
                questions: [
                    { question: "Wat moet je doen als je auto in een slip raakt door aquaplaning?", options: ["Hard remmen en aan het stuur rukken", "Gas loslaten, koppeling indrukken en stuur recht houden tot je grip terug hebt", "Direct de handrem aantrekken", "Vol gas bijgeven om er doorheen te trekken"], correct: 1 },
                    { question: "Wat is een veilige volgafstand op de snelweg onder normale omstandigheden?", options: ["1 seconde", "Minstens 2 seconden (de twee-secondenregel)", "5 meter", "Zoveel mogelijk bumperkleven"], correct: 1 }
                ]
            },
            {
                title: "5. Verkeerstekens en aanwijzingen",
                questions: [
                    { question: "Wat betekent een rood kruis boven een rijstrook op de snelweg?", options: ["Je mag hier tijdelijk parkeren", "De rijstrook is afgesloten, je mag er niet rijden", "Maximumsnelheid is 90 km/u", "Alleen voor vrachtwagens bestemd"], correct: 1 },
                    { question: "Wie geeft er voorrangsregels aan als een verkeersregelaar een stopteken geeft met gestrekte arm omhoog?", options: ["Alleen het overige verkeer", "Iedereen moet stoppen voor de kruising", "Alleen voetgangers", "Je mag doorrijden als je al op de kruising bent"], correct: 1 }
                ]
            },
            {
                title: "6. Verantwoorde verkeersdeelname en milieubewust",
                questions: [
                    { question: "Wat is het voordeel van 'het nieuwe rijden'?", options: ["Je remt nooit meer", "Brandstofbesparing en minder CO2-uitstoot", "Je auto gaat sneller optrekken", "Je hoeft je banden nooit meer op te pompen"], correct: 1 },
                    { question: "Wat is een groot risico van vermoeidheid achter het stuur?", options: ["Langzamere reactietijd en microslaapjes", "Dat je radio uitvalt", "Dat je auto meer brandstof verbruikt", "Geen enkel risico"], correct: 0 }
                ]
            },
            {
                title: "7. Wetgeving en documenten",
                questions: [
                    { question: "Welke papieren moet je altijd verplicht bij je hebben als je in Nederland auto rijdt?", options: ["Alleen je legitimatiebewijs", "Rijbewijs en het kentekenbewijs van het voertuig", "Alleen een verzekeringsbewijs op papier", "Geen enkelem alles staat digitaal bij de politie"], correct: 1 },
                    { question: "Wat is het maximum promillage alcohol voor een beginnende bestuurder?", options: ["0.0 promille (wettelijk toegestaan is max 0.2)", "0.5 promille", "0.8 promille", "1.0 promille"], correct: 0 }
                ]
            },
            {
                title: "8. Voertuigkennis en lading",
                questions: [
                    { question: "Wanneer moeten je autolichten branden?", options: ["Alleen als het pikkedonker is", "Bij duisternis, slecht zicht of overdag bij onverlichte situaties", "Nooit overdag", "Alleen op de snelweg"], correct: 1 },
                    { question: "Hoeveel mag lading aan de achterzijde van een personenauto maximaal uitsteken (zonder markering)?", options: ["Niks, het mag nooit uitsteken", "Maximaal 1 meter", "Maximaal 5 meter", "Tot wel 10 meter"], correct: 1 }
                ]
            }
        ];

        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let examTitle = "";

        const homeScreen = document.getElementById("home-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const chapterList = document.getElementById("chapter-list");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const questionCounter = document.getElementById("question-counter");
        const resultText = document.getElementById("result-text");

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initHome() {
            chapterList.innerHTML = "";
            chapters.forEach((chap, index) => {
                const btn = document.createElement("button");
                btn.classList.add("chapter-btn");
                btn.innerText = chap.title;
                btn.onclick = () => startChapter(index);
                chapterList.appendChild(btn);
            });
        }

        function startChapter(index) {
            const chap = chapters[index];
            examTitle = chap.title;
            activeQuestions = shuffleArray(chap.questions);
            startQuiz();
        }

        function startFullExam() {
            examTitle = "Volledig CBR Proefexamen";
            let allQuestions = [];
            chapters.forEach(chap => {
                allQuestions = allQuestions.concat(chap.questions);
            });
            activeQuestions = shuffleArray(allQuestions);
            startQuiz();
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            homeScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            quizScreen.classList.add("active");
            showQuestion();
        }

        function returnToHome() {
            quizScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            homeScreen.classList.add("active");
        }

        function showQuestion() {
            nextBtn.style.display = "none";
            const currentQ = activeQuestions[currentQuestionIndex];
            
            questionCounter.innerText = `${examTitle} — Vraag ${currentQuestionIndex + 1} van ${activeQuestions.length}`;
            questionText.innerText = currentQ.question;
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((option, optIndex) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(optIndex, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            const currentQ = activeQuestions[currentQuestionIndex];
            const buttons = optionsContainer.getElementsByTagName("button");

            for (let btn of buttons) {
                btn.disabled = true;
            }

            if (selectedIndex === currentQ.correct) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                buttons[currentQ.correct].classList.add("correct");
            }

            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.remove("active");
            resultScreen.classList.add("active");
            resultText.innerText = `Je hebt ${score} van de ${activeQuestions.length} vragen goed beantwoord in dit examen!`;
        }

        initHome();
    </script>
</body>
</html>
